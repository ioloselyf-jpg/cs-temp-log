<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:'aktiv-grotesk','Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#fb0000}

/* HEADER */
.hdr{background:#000;border-bottom:2px solid #fb0000;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.logo{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:900;font-size:1.3rem;letter-spacing:3px;text-transform:uppercase;line-height:1;cursor:pointer}
.logo .r{color:#fb0000}
.logo-sub{font-size:0.45rem;letter-spacing:5px;color:#888;display:block;margin-top:2px;font-weight:400}
.hdr-right{display:flex;align-items:center;gap:10px}
.back-btn{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;background:none;border:1px solid #333;color:#666;cursor:pointer;transition:all 0.15s}
.back-btn:hover{border-color:#fb0000;color:#fff}
.sbadge{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;border:1px solid;padding:3px 8px}
.s-live{color:#4caf50;border-color:#4caf50}.s-conn{color:#666;border-color:#333}.s-err{color:#fb0000;border-color:#fb0000}

/* DASHBOARD */
.dash{max-width:900px;margin:0 auto;padding:32px 20px 80px}
.dash-hero{text-align:center;padding:40px 0 48px;border-bottom:1px solid #111;margin-bottom:40px}
.dash-title{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:900;font-size:clamp(2.6rem,8vw,4.8rem);letter-spacing:1px;line-height:0.95;text-transform:uppercase}
.dash-title .r{color:#fb0000}
.dash-sub{font-size:0.6rem;letter-spacing:5px;color:#888;margin-top:12px;text-transform:uppercase}
.dash-meta{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.72rem;letter-spacing:2px;color:#444;margin-top:6px;text-transform:uppercase}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px}
.dash-card{background:#0a0a0a;border-left:3px solid #fb0000;padding:0;cursor:pointer;transition:background 0.15s;position:relative;overflow:hidden}
.dash-card:hover{background:#0f0f0f}
.dash-card.locked{border-left-color:#333}
.dash-card.open-access{border-left-color:#fb0000}
.dash-card-inner{padding:22px 20px}
.dash-icon{font-size:2rem;margin-bottom:12px;display:block}
.dash-name{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:900;font-size:1.1rem;letter-spacing:3px;text-transform:uppercase;color:#fff}
.dash-desc{font-size:0.72rem;color:#666;margin-top:6px;line-height:1.5}
.dash-badge{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.55rem;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border:1px solid;margin-top:10px;display:inline-block}
.badge-open{color:#4caf50;border-color:#4caf50}
.badge-locked{color:#555;border-color:#333}
.dash-arrow{position:absolute;bottom:18px;right:18px;color:#fb0000;font-size:1rem;opacity:0;transition:opacity 0.15s}
.dash-card:hover .dash-arrow{opacity:1}

/* PIN GATE */
.pin-gate{max-width:300px;margin:80px auto 0;text-align:center}
.pin-icon{font-size:2.5rem;margin-bottom:16px}
.pin-title{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:900;font-size:1.1rem;letter-spacing:4px;text-transform:uppercase;color:#fff;margin-bottom:6px}
.pin-sub{font-size:0.7rem;color:#888;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.pin-dots{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #222;background:transparent;transition:all 0.15s}
.pin-dot.filled{background:#fb0000;border-color:#fb0000}
.pin-dot.error{background:#fb0000;border-color:#fb0000;animation:shake 0.3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:220px;margin:0 auto}
.pin-btn{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:900;font-size:1.3rem;padding:14px;background:#0d0d0d;border:1px solid #1a1a1a;color:#fff;cursor:pointer;transition:all 0.15s}
.pin-btn:hover{background:#1a1a1a;border-color:#333}
.pin-btn.empty{background:transparent;border:none;cursor:default}
.pin-error{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:#fb0000;margin-top:12px;min-height:20px}

/* SECTION WRAPPER */
.section-wrap{max-width:960px;margin:0 auto;padding:20px 20px 100px}

/* REMINDERS BANNER */
.rem-banner{background:#0a0a0a;border-bottom:2px solid #fb0000;position:sticky;top:56px;z-index:150}
.rem-banner.all-done{border-bottom-color:#1e3a1e}
.rem-head{display:flex;align-items:center;justify-content:space-between;padding:9px 20px;cursor:pointer}
.rem-head-left{display:flex;align-items:center;gap:8px}
.rem-icon{font-size:0.9rem}
.rem-title{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:800;font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;color:#ddd}
.rem-body{padding:0 20px 16px;max-width:900px;margin:0 auto}
.rem-name-row{margin-bottom:10px}
.rem-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #141414}
.rem-item:last-child{border-bottom:none}
.rem-item.done .rem-lbl{color:#666;text-decoration:line-through}
.rem-dot{font-size:1rem;width:20px;text-align:center;color:#555;flex-shrink:0}
.rem-item.done .rem-dot{color:#4caf50}
.rem-txt{flex:1}
.rem-lbl{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:700;font-size:0.82rem;color:#eee}
.rem-sub{font-size:0.62rem;color:#666;margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.rem-tick-btn{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:800;font-size:0.62rem;letter-spacing:1px;text-transform:uppercase;padding:7px 12px;background:#fb0000;border:none;color:#fff;cursor:pointer;flex-shrink:0}

/* ============ SHARED COMPONENTS ============ */
.hero{background:#000;border-bottom:1px solid #111;padding:32px 24px 24px;text-align:center}
.ht{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:900;font-size:clamp(2.2rem,6.5vw,4rem);letter-spacing:1px;line-height:0.95;text-transform:uppercase}
.ht .r{color:#fb0000}
.hero-sub{font-size:0.6rem;letter-spacing:5px;color:#888;margin-top:10px;text-transform:uppercase}
.scores{display:flex;gap:1px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.score-box{background:#0d0d0d;border:1px solid #1a1a1a;padding:12px 20px;min-width:90px;text-align:center}
.score-num{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:900;font-size:2rem;line-height:1}
.score-lbl{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.55rem;letter-spacing:3px;color:#666;margin-top:4px;text-transform:uppercase}
.tabs{display:flex;border-bottom:1px solid #111;background:#000;overflow-x:auto}
.tab{flex:1;min-width:90px;background:none;border:none;border-bottom:3px solid transparent;padding:12px 8px 9px;color:#666;font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:700;font-size:0.78rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.tab:hover{color:#fff;background:#0a0a0a}.tab.on{color:#fff;border-bottom-color:#fb0000;background:#0a0a0a}
.tab-ct{display:block;font-size:0.48rem;letter-spacing:1px;color:#555;margin-top:2px;font-weight:400;font-family:'aktiv-grotesk','Inter',sans-serif}
.tab.on .tab-ct{color:#888}
.main{padding:20px 0 80px}
.section{border-left:3px solid #1a1a1a;border-bottom:1px solid #0d0d0d;background:#0a0a0a;margin-bottom:2px;transition:border-left-color 0.3s}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;cursor:pointer;transition:background 0.1s}
.sec-hdr:hover{background:#0f0f0f}
.sec-title{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:800;font-size:0.92rem;letter-spacing:2px;text-transform:uppercase;color:#fff}
.sec-meta{font-size:0.57rem;letter-spacing:2px;color:#666;text-transform:uppercase;margin-top:2px}
.sec-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sec-ct{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.68rem;color:#444;letter-spacing:1px}
.chev{color:#fb0000;font-size:0.55rem;transition:transform 0.2s}.chev.op{transform:rotate(180deg)}
.sec-body{padding:0 18px 16px}
.callout{border-left:2px solid #fb0000;padding:8px 12px;background:rgba(251,0,0,0.05);margin-bottom:10px;font-size:0.74rem;color:#888;line-height:1.6}
.callout.gold{border-left-color:#333;background:rgba(255,255,255,0.02)}.callout strong{color:#fb0000}.callout.gold strong{color:#aaa}
.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #0d0d0d}
.item:last-child{border-bottom:none}.item:hover{background:rgba(255,255,255,0.01)}
.chk{width:18px;height:18px;border:1px solid #222;flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;font-size:0.6rem;color:#fff;font-weight:900}
.chk:hover{border-color:#fb0000}.chk.on{background:#fb0000;border-color:#fb0000}
.i-title{font-size:0.82rem;font-weight:600;color:#ddd;line-height:1.4}
.i-title.done{color:#333;text-decoration:line-through}
.i-det{font-size:0.72rem;color:#555;margin-top:3px;line-height:1.5}
.i-law{font-size:0.57rem;color:#333;margin-top:3px}
.i-freq{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.6rem;color:#fb0000;margin-top:3px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.ptag{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.56rem;letter-spacing:2px;text-transform:uppercase;padding:2px 6px;border:1px solid;font-weight:700}
.tc{color:#fb0000;border-color:#fb0000;background:rgba(251,0,0,0.08)}
.ti{color:#777;border-color:#333;background:transparent}
.ts{color:#444;border-color:#222;background:transparent}
.field-label{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.58rem;letter-spacing:2px;text-transform:uppercase;color:#777;margin-bottom:4px;margin-top:12px;display:block}
.field-label:first-child{margin-top:0}
.txt-input{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.8rem;padding:8px 11px;background:#0d0d0d;border:1px solid #1a1a1a;color:#fff;outline:none;transition:border-color 0.2s;width:100%}
.txt-input::placeholder{color:#2a2a2a}.txt-input:focus{border-color:#fb0000}
.sel-input{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.8rem;padding:8px 11px;background:#0d0d0d;border:1px solid #1a1a1a;color:#fff;outline:none;width:100%;cursor:pointer}
.sel-input:focus{border-color:#fb0000}
.btn-red{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:900;font-size:0.8rem;letter-spacing:2px;text-transform:uppercase;padding:10px 20px;background:#fb0000;border:none;color:#fff;cursor:pointer;transition:all 0.15s}
.btn-red:hover{background:#9e0c23}
.btn-outline{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:700;font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;padding:9px 18px;background:none;border:1px solid #333;color:#777;cursor:pointer;transition:all 0.15s}
.btn-outline:hover{border-color:#fb0000;color:#fff}
.pb{max-width:340px;margin:14px auto 0;height:2px;background:#1a1a1a}
.pf{height:100%;background:#fb0000;transition:width 0.5s ease,background 0.3s}
.empty-state{text-align:center;padding:48px 20px;font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.8rem;letter-spacing:3px;text-transform:uppercase;color:#333}

/* TEMPS */
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px}
.unit-card{background:#0a0a0a;border-left:3px solid #222}
.unit-card.ok{border-left-color:#4caf50}.unit-card.warn{border-left-color:#ff9800}.unit-card.danger{border-left-color:#fb0000}
.unit-hdr{padding:12px 14px 8px;border-bottom:1px solid #0d0d0d}
.unit-name{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:800;font-size:0.92rem;letter-spacing:2px;text-transform:uppercase;color:#fff}
.unit-type{font-size:0.56rem;letter-spacing:2px;color:#666;text-transform:uppercase;margin-top:2px}
.unit-limit{font-size:0.58rem;color:#777;margin-top:2px}
.unit-body{padding:12px 14px}
.temp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.temp-wrap{position:relative;flex:1}
.temp-inp{width:100%;font-family:'aktiv-grotesk','Inter',sans-serif;font-size:1.5rem;font-weight:900;padding:9px 32px 9px 10px;background:#111;border:1px solid #222;color:#fff;outline:none;letter-spacing:2px;transition:border-color 0.2s}
.temp-inp:focus{border-color:#fb0000}
.temp-inp.ok{border-color:#4caf50;color:#4caf50}.temp-inp.warn{border-color:#ff9800;color:#ff9800}.temp-inp.danger{border-color:#fb0000;color:#fb0000}
.temp-unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.75rem;color:#444}
.temp-quick-row{display:flex;gap:4px;margin-top:4px}
.temp-quick-btn{font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:900;font-size:0.85rem;letter-spacing:2px;padding:8px 14px;background:#1a1a1a;border:1px solid #333;color:#fb0000;cursor:pointer;transition:all 0.15s}
.temp-quick-btn:hover{background:#fb0000;color:#fff;border-color:#fb0000}
.status-chip{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.62rem;letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border:1px solid;font-weight:700}
.chip-ok{color:#4caf50;border-color:#4caf50;background:rgba(76,175,80,0.08)}
.chip-warn{color:#ff9800;border-color:#ff9800;background:rgba(255,152,0,0.08)}
.chip-danger{color:#fb0000;border-color:#fb0000;background:rgba(251,0,0,0.08)}
.chip-empty{color:#2a2a2a;border-color:#111}
.log-btn{width:100%;font-family:'aktiv-grotesk','Inter',sans-serif;font-weight:900;font-size:0.8rem;letter-spacing:2px;text-transform:uppercase;padding:10px;background:#fb0000;border:none;color:#fff;cursor:pointer;margin-top:8px;transition:all 0.15s}
.log-btn:hover{background:#9e0c23}
.log-btn:disabled{background:#111;color:#2a2a2a;cursor:not-allowed}
.log-btn.logged{background:#0d1a0d;border:1px solid #4caf50;color:#4caf50}
.last-log{font-size:0.58rem;color:#444;margin-top:6px;font-family:'aktiv-grotesk','Inter',sans-serif;letter-spacing:1px;text-transform:uppercase}
.action-inp{width:100%;font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.72rem;padding:7px 9px;background:#111;border:1px solid #1a1a1a;color:#aaa;outline:none;resize:none;height:52px}
.action-inp:focus{border-color:#fb0000}
.action-lbl{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.57rem;letter-spacing:2px;text-transform:uppercase;color:#fb0000;margin-bottom:3px;display:block;margin-top:8px}
.session-bar{padding:16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #111;margin-bottom:16px}
.session-lbl{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.65rem;letter-spacing:3px;text-transform:uppercase;color:#888;flex-shrink:0}
.sess-btns{display:flex;gap:2px;flex-wrap:wrap}
.sess-btn{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;padding:7px 14px;border:1px solid #222;background:none;color:#555;cursor:pointer;transition:all 0.15s;font-weight:700}
.sess-btn:hover{border-color:#fb0000;color:#fff}
.sess-btn.on{background:#fb0000;border-color:#fb0000;color:#fff}
.area-btns{display:flex;gap:2px;margin-bottom:16px}
.area-btn{font-family:'aktiv-grotesk','Inter',sans-serif;font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;padding:8px 18px;border:1px solid #222;background:none;color:#555;cursor:pointer;font-weight:700;transition:all 0.15s}
.area-btn:hover{border-color:#888;color:#fff}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function modInput(value,onInput,placeholder,type){const i=el('input','mod-input');i.type=type||'text';i.value=value||'';if(placeholder)i.placeholder=placeholder;i.oninput=e=>onInput(e.target.value);return i}
function modSelect(value,options,onChange){const s=el('select','mod-select');options.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(value===v)o.selected=true;s.appendChild(o)});s.onchange=e=>onChange(e.target.value);return s}
function areaLabel(a){return AREA_LABELS[a]||(a.charAt(0).toUpperCase()+a.slice(1))}
const AREAS=[...new Set(UNITS.filter(u=>!u.retired).map(u=>u.area))]

const STAFF_KEY='cs-temps-staff'
let savedStaff='';try{savedStaff=localStorage.getItem(STAFF_KEY)||''}catch(e){}
const G={temps:{tab:AREAS[0]||'history',session:'',staffName:savedStaff,readings:{},actions:{},submitted:{},unitHist:{},histFrom:'',histTo:'',histArea:'all',histLoaded:false,histLoading:false,histRows:[],calDraft:{probe_name:'',ice_temp:'',boil_temp:'',staff_name:savedStaff,notes:'',corrective_action:''},calItems:[],calLoaded:false,calLoading:false,calSaving:false}}

let updateSubmit=()=>{}
function getTempStatus(unit,val){
  if(val===''||val===null||val===undefined)return'empty'
  const n=parseFloat(val);if(isNaN(n))return'empty'
  if(unit.type==='freezer')return n<=unit.max?'ok':n>unit.warn?'danger':'warn'
  return n<=unit.max?'ok':n>=unit.warn?'danger':'warn'
}

function render(){
  const app=document.getElementById('app')
  const ae=document.activeElement
  app.innerHTML=''
  const top=el('div','hdr')
  top.innerHTML=`<div class="logo"><span class="r">cHIP</span> sHOP BXTN<span class="logo-sub">TEMP LOG</span></div>`
  app.appendChild(top)
  renderTemps(app)
  const f=el('div','foot');f.textContent=`${SITE_NAME} · Temperature records kept for at least 3 months`;app.appendChild(f)
}

function renderTemps(app){
  const T=G.temps
  const h=new Date().getHours()
  if(!T.session)T.session=h<11?'Opening':h<16?'Midday':'Closing'
  const units=UNITS.filter(u=>u.area===T.tab&&!u.retired)
  const logged=units.filter(u=>T.submitted[u.id]).length

  const hero=el('div','hero')
  hero.innerHTML=`<div class="ht">Temp <span class="r">Log</span></div><div class="hero-sub">UK Food Safety — Every Service — All times UK</div>`
  app.appendChild(hero)

  if(!CONFIGURED){const s=el('div','setup');s.innerHTML='<strong>Not connected to the database yet.</strong> Readings can\'t be saved until the Supabase details are added to the site settings.';app.appendChild(s)}

  const lb=el('div','law')
  lb.innerHTML='<strong>UK Law:</strong> Chilled food ≤8°C (best ≤5°C) · Frozen ≤-18°C · Log every service · Keep records 3 months minimum'
  app.appendChild(lb)

  const sbar=el('div','session-bar')
  const sl=el('div','session-lbl');sl.textContent='Service:'
  const sbtns=el('div','sess-btns')
  ;['Opening','Midday','Closing'].forEach(s=>{
    const b=el('button','sess-btn'+(T.session===s?' on':''));b.textContent=s
    b.onclick=()=>{T.session=s;render()};sbtns.appendChild(b)
  })
  const sl2=el('div','session-lbl');sl2.textContent='Logged by:'
  const sinp=el('input','txt-input');sinp.placeholder='Your name…';sinp.value=T.staffName;sinp.style.cssText='max-width:180px;flex:none'
  sinp.oninput=e=>{T.staffName=e.target.value;try{localStorage.setItem(STAFF_KEY,e.target.value)}catch(err){}}
  sbar.appendChild(sl);sbar.appendChild(sbtns);sbar.appendChild(sl2);sbar.appendChild(sinp)

  const tabs=el('div','tabs')
  AREAS.forEach(key=>{
    const t=el('button','tab'+(T.tab===key?' on':''))
    const items=UNITS.filter(u=>u.area===key&&!u.retired)
    const d=items.filter(u=>T.submitted[u.id]).length
    t.innerHTML=`${areaLabel(key)}<span class="tab-ct">${d}/${items.length} logged</span>`
    t.onclick=()=>{T.tab=key;render()};tabs.appendChild(t)
  })
  const calTab=el('button','tab'+(T.tab==='calibration'?' on':''));calTab.textContent='🌡️ Calibration'
  calTab.onclick=()=>{T.tab='calibration';render()};tabs.appendChild(calTab)
  const histTab=el('button','tab'+(T.tab==='history'?' on':''));histTab.textContent='📜 History'
  histTab.onclick=()=>{T.tab='history';render()};tabs.appendChild(histTab)
  app.appendChild(tabs)

  if(T.tab==='calibration'){tempsRenderCalibration(app,T);return}
  if(T.tab==='history'){tempsRenderHistory(app,T);return}
  const main=el('div','section-wrap')
  main.appendChild(sbar)
  const grid=el('div','unit-grid')
  units.forEach(unit=>{
    const val=T.readings[unit.id]
    const action=T.actions[unit.id]||''
    const s=getTempStatus(unit,val)
    const isLogged=!!T.submitted[unit.id]
    const card=el('div','unit-card'+(s!=='empty'?' '+s:''))

    const uhdr=el('div','unit-hdr')
    uhdr.innerHTML=`<div class="unit-name">${unit.num} — ${esc(unit.name)}</div><div class="unit-type">${esc(unit.area)} · ${unit.type}</div><div class="unit-limit">${unit.type==='freezer'?'Legal max: -18°C':'Legal max: 8°C'} · Target: ≤${unit.max}°C</div>`
    card.appendChild(uhdr)

    const ubody=el('div','unit-body')
    const trow=el('div','temp-row')
    const logbtn=el('button','log-btn'+(isLogged?' logged':''))
    logbtn.textContent=isLogged?'✓ Logged':'Log This Reading'
    const updateLogBtn=()=>{
      const cur=T.readings[unit.id]
      const n=parseFloat(cur)
      logbtn.disabled=isLogged||cur===undefined||cur===''||cur==='-'||isNaN(n)
    }

    const tw=el('div','temp-wrap')
    const tinp=el('input','temp-inp'+(s!=='empty'?' '+s:''))
    tinp.type='text';tinp.inputMode='text';tinp.autocomplete='off'
    tinp.placeholder=unit.type==='freezer'?'-18.0':'0.0'
    tinp.dataset.unit=unit.id
    if(val===undefined&&unit.type==='freezer'&&!isLogged){T.readings[unit.id]='-'}
    tinp.value=T.readings[unit.id]!==undefined?T.readings[unit.id]:''
    if(isLogged)tinp.disabled=true
    tinp.oninput=e=>{
      // digits, one optional leading minus, one optional decimal — no re-render, keeps focus
      let v=e.target.value.replace(/[^0-9.\-]/g,'')
      if(v.indexOf('-')>0) v=v.replace(/-/g,'')
      const firstDot=v.indexOf('.')
      if(firstDot>=0) v=v.slice(0,firstDot+1)+v.slice(firstDot+1).replace(/\./g,'')
      e.target.value=v
      T.readings[unit.id]=v
      const n=parseFloat(v)
      const ns=isNaN(n)?'empty':getTempStatus(unit,v)
      tinp.classList.remove('ok','warn','danger');card.classList.remove('ok','warn','danger')
      if(ns!=='empty'){tinp.classList.add(ns);card.classList.add(ns)}
      chip.className='status-chip '+(ns==='ok'?'chip-ok':ns==='warn'?'chip-warn':ns==='danger'?'chip-danger':'chip-empty')
      chip.textContent=ns==='ok'?'✓ OK':ns==='warn'?'⚠ CHECK':ns==='danger'?'✕ ACTION':'—'
      actWrap.style.display=(ns==='warn'||ns==='danger')?'block':'none'
      updateLogBtn();updateSubmit()
    }
    const tu=el('span','temp-unit');tu.textContent='°C'
    tw.appendChild(tinp);tw.appendChild(tu)

    var chip=el('div','status-chip '+(s==='ok'?'chip-ok':s==='warn'?'chip-warn':s==='danger'?'chip-danger':'chip-empty'))
    chip.textContent=s==='ok'?'✓ OK':s==='warn'?'⚠ CHECK':s==='danger'?'✕ ACTION':'—'
    trow.appendChild(tw);trow.appendChild(chip)
    ubody.appendChild(trow)
    const noteDiv=el('div','unit-limit');noteDiv.style.marginBottom='6px';noteDiv.textContent=unit.note||''
    ubody.appendChild(noteDiv)

    // Corrective action box is always built and shown/hidden in place, so typing is never interrupted
    const actWrap=el('div');actWrap.style.display=((s==='warn'||s==='danger')&&!isLogged)?'block':'none'
    const al=el('span','action-lbl');al.textContent='⚠ Corrective Action Required'
    const ai=el('textarea','action-inp');ai.placeholder='Describe action taken…';ai.value=action
    ai.oninput=e=>{T.actions[unit.id]=e.target.value}
    actWrap.appendChild(al);actWrap.appendChild(ai);ubody.appendChild(actWrap)

    updateLogBtn()
    logbtn.onclick=()=>logSingleTemp(unit)
    ubody.appendChild(logbtn)

    const ll=el('div','last-log')
    const lastEntry=T.unitHist[unit.id]?.[0]
    ll.textContent=lastEntry?`Last: ${new Date(lastEntry.logged_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})} ${new Date(lastEntry.logged_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} — ${lastEntry.temperature}°C by ${lastEntry.staff_name||'?'}`:'No logs yet today'
    ubody.appendChild(ll)
    card.appendChild(ubody);grid.appendChild(card)
  })
  main.appendChild(grid);app.appendChild(main)

  const subbar=el('div','submit-bar')
  const sum=el('div','submit-sum')
  sum.innerHTML=`<strong>${logged}/${units.length}</strong> units logged this ${T.session} service`
  const filledCount=units.filter(u=>{const r=T.readings[u.id];return r!==undefined&&r!==''&&r!=='-'&&!isNaN(parseFloat(r))}).length
  const subbtn=el('button','submit-all')
  updateSubmit=()=>{const fc=units.filter(u=>{const r=T.readings[u.id];return r!==undefined&&r!==''&&r!=='-'&&!isNaN(parseFloat(r))&&!T.submitted[u.id]}).length;subbtn.disabled=fc===0}
  subbtn.textContent=`Submit All ${areaLabel(T.tab).replace(/^\S+\s/,'')} Readings`
  updateSubmit()
  subbtn.onclick=()=>logAllTemps(units)
  subbar.appendChild(sum);subbar.appendChild(subbtn);app.appendChild(subbar)
}

function tempsRenderHistory(app,T){
  if(!T.histFrom){const to=new Date();const from=new Date(to-29*86400000);T.histTo=localDateStr(to);T.histFrom=localDateStr(from)}
  const wrap=el('div','section-wrap')
  const filterRow=el('div','mod-form-grid')
  filterRow.appendChild(modField('From',modInput(T.histFrom,v=>{T.histFrom=v;T.histLoaded=false;render()},'','date')))
  filterRow.appendChild(modField('To',modInput(T.histTo,v=>{T.histTo=v;T.histLoaded=false;render()},'','date')))
  const histAreas=[...new Set(UNITS.map(u=>u.area))]
  filterRow.appendChild(modField('Area',modSelect(T.histArea,[['all','All'],...histAreas.map(a=>[a,areaLabel(a).replace(/^\S+\s/,'')])],v=>{T.histArea=v;render()})))
  wrap.appendChild(filterRow)

  if(!T.histLoaded&&!T.histLoading) tempsLoadHistory(T)
  if(T.histLoading){const e=el('div','empty-state');e.textContent='Loading…';wrap.appendChild(e);app.appendChild(wrap);return}
  if(!T.histLoaded){app.appendChild(wrap);return}

  const rows=T.histArea==='all'?T.histRows:T.histRows.filter(r=>r.area===T.histArea)
  const dates=[]
  const d0=new Date(T.histFrom+'T12:00:00'),d1=new Date(T.histTo+'T12:00:00')
  for(let d=new Date(d1);d>=d0;d.setDate(d.getDate()-1))dates.push(localDateStr(d))
  const byDate={}
  rows.forEach(r=>{(byDate[r.log_date]=byDate[r.log_date]||[]).push(r)})
  const loggedDays=dates.filter(d=>byDate[d]&&byDate[d].length).length
  const summary=el('div','mod-banner')
  summary.textContent=`${loggedDays} of ${dates.length} days in this range have at least one reading logged.`
  wrap.appendChild(summary)

  dates.forEach(date=>{
    const dayRows=byDate[date]
    const dh=el('div','mod-section-hdr')
    const niceDate=new Date(date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})
    dh.textContent=dayRows?`${niceDate} — ${dayRows.length} reading${dayRows.length===1?'':'s'}`:`${niceDate} — no readings logged`
    if(!dayRows)dh.style.color='var(--muted)'
    wrap.appendChild(dh)
    if(!dayRows)return
    dayRows.sort((a,b)=>a.unit_name.localeCompare(b.unit_name)).forEach(r=>{
      const unit=UNITS.find(u=>u.id===r.unit_id)
      const status=unit?getTempStatus(unit,r.temperature):'ok'
      const card=el('div','mod-card h-row')
      card.innerHTML=`<div><div class="h-name">${esc(r.unit_name)} <span class="h-meta">— ${esc(r.session)}</span></div><div class="h-meta">${esc(r.staff_name||'—')}${r.corrective_action?' · '+esc(r.corrective_action):''}</div></div><div class="h-temp ${status}">${r.temperature}°C</div>`
      wrap.appendChild(card)
    })
  })
  app.appendChild(wrap)
}
async function tempsLoadHistory(T){
  if(!db){T.histRows=[];T.histLoaded=true;return}
  T.histLoading=true;render()
  const{data}=await db.from(TEMP_TABLE).select('*').gte('log_date',T.histFrom).lte('log_date',T.histTo).order('log_date',{ascending:false})
  T.histRows=data||[]
  T.histLoaded=true;T.histLoading=false;render()
}

// ============================================================
// PROBE CALIBRATION
// ============================================================
const CAL_ICE_MIN=-1,CAL_ICE_MAX=1
const CAL_BOIL_MIN=99,CAL_BOIL_MAX=101

async function tempsLoadCalibration(T){
  if(T.calLoading)return
  if(!db){T.calItems=[];T.calLoaded=true;return}
  T.calLoading=true;render()
  const{data}=await db.from(CAL_TABLE).select('*').order('logged_at',{ascending:false}).limit(60)
  T.calItems=data||[]
  T.calLoaded=true;T.calLoading=false;render()
}

async function tempsSaveCalibration(){
  const T=G.temps,d=T.calDraft
  if(!db){alert('Not connected to the database yet.');return}
  if(!d.probe_name.trim()){alert('Enter a probe name/ID.');return}
  if(!d.staff_name.trim()){alert('Please enter your name.');return}
  const ice=parseFloat(d.ice_temp),boil=parseFloat(d.boil_temp)
  if(isNaN(ice)||isNaN(boil)){alert('Enter both the ice water and boiling water readings.');return}
  const icePass=ice>=CAL_ICE_MIN&&ice<=CAL_ICE_MAX
  const boilPass=boil>=CAL_BOIL_MIN&&boil<=CAL_BOIL_MAX
  const overallPass=icePass&&boilPass
  if(!overallPass&&!(d.corrective_action||'').trim()){alert('This probe failed calibration — describe the corrective action (e.g. recalibrated, taken out of service, replaced) before saving.');return}
  T.calSaving=true;render()
  const row={probe_name:d.probe_name.trim(),ice_water_temp:ice,boiling_water_temp:boil,ice_pass:icePass,boil_pass:boilPass,overall_pass:overallPass,corrective_action:d.corrective_action||null,staff_name:d.staff_name.trim(),notes:d.notes||null,logged_at:new Date().toISOString(),log_date:todayStr()}
  const{error}=await db.from(CAL_TABLE).insert(row)
  T.calSaving=false
  if(error){alert('Error: '+error.message);render();return}
  T.calDraft={probe_name:d.probe_name,ice_temp:'',boil_temp:'',staff_name:d.staff_name,notes:'',corrective_action:''}
  T.calItems.unshift(row)
  render()
}

function tempsRenderCalibration(app,T){
  const d=T.calDraft
  const wrap=el('div','section-wrap')
  const lb=el('div','law')
  lb.innerHTML='<strong>UK Law:</strong> Check every probe thermometer weekly. Ice water should read 0°C (±1°C) · Boiling water should read 100°C (±1°C) · If a probe fails, take it out of service and log the corrective action. Keep records 3 months minimum.'
  wrap.appendChild(lb)

  const form=el('div','mod-card')
  const grid=el('div','mod-form-grid')
  grid.appendChild(modField('Probe name / ID',modInput(d.probe_name,v=>{d.probe_name=v},'e.g. Kitchen Probe 1')))
  grid.appendChild(modField('Logged by',modInput(d.staff_name,v=>{d.staff_name=v},'Your name')))
  form.appendChild(grid)

  const calState=()=>{const iceN=parseFloat(d.ice_temp),boilN=parseFloat(d.boil_temp);return{iceN,boilN,icePass:!isNaN(iceN)&&iceN>=CAL_ICE_MIN&&iceN<=CAL_ICE_MAX,boilPass:!isNaN(boilN)&&boilN>=CAL_BOIL_MIN&&boilN<=CAL_BOIL_MAX}}
  const calChips={}
  const calTempField=(label,key,placeholder)=>{
    const wrapEl=el('div')
    const inp=el('input','mod-input');inp.type='text';inp.inputMode='text';inp.autocomplete='off'
    inp.placeholder=placeholder;inp.value=d[key]||''
    const chip=el('div','status-chip');chip.style.cssText='margin-top:6px;display:none'
    calChips[key]=chip
    inp.oninput=e=>{
      let v=e.target.value.replace(/[^0-9.\-]/g,'')
      if(v.indexOf('-')>0)v=v.replace(/-/g,'')
      const fd=v.indexOf('.')
      if(fd>=0)v=v.slice(0,fd+1)+v.slice(fd+1).replace(/\./g,'')
      e.target.value=v;d[key]=v;refreshCal()
    }
    wrapEl.appendChild(modField(label,inp));wrapEl.appendChild(chip)
    return wrapEl
  }
  const grid2=el('div','mod-form-grid')
  grid2.appendChild(calTempField('Ice water reading (°C) — target 0°C ±1','ice_temp','0.0'))
  grid2.appendChild(calTempField('Boiling water reading (°C) — target 100°C ±1','boil_temp','100.0'))
  form.appendChild(grid2)

  const caWrap=el('div');caWrap.style.display='none'
  const lCA=el('span','action-lbl');lCA.textContent='Corrective action (required — probe failed)'
  const tCA=el('textarea','action-inp')
  tCA.placeholder='e.g. Taken out of service, recalibrated against reference probe, replaced with spare…'
  tCA.value=d.corrective_action||'';tCA.oninput=()=>{d.corrective_action=tCA.value}
  caWrap.appendChild(lCA);caWrap.appendChild(tCA)
  form.appendChild(caWrap)

  const refreshCal=()=>{
    const s=calState()
    const setChip=(chip,n,pass)=>{if(isNaN(n)){chip.style.display='none';return}chip.style.display='inline-block';chip.className='status-chip '+(pass?'chip-ok':'chip-danger');chip.textContent=pass?'✓ Pass':'✕ Fail'}
    setChip(calChips.ice_temp,s.iceN,s.icePass)
    setChip(calChips.boil_temp,s.boilN,s.boilPass)
    const bothEntered=!isNaN(s.iceN)&&!isNaN(s.boilN)
    caWrap.style.display=(bothEntered&&!(s.icePass&&s.boilPass))?'block':'none'
  }
  refreshCal()

  const lNotes2=el('span','field-label');lNotes2.textContent='Notes (optional)'
  const tNotes2=el('textarea','action-inp');tNotes2.style.height='50px'
  tNotes2.value=d.notes||'';tNotes2.oninput=()=>{d.notes=tNotes2.value}
  form.appendChild(lNotes2);form.appendChild(tNotes2)

  const acts=el('div','mod-actions')
  const save=el('button','mod-btn');save.textContent=T.calSaving?'Saving…':'Log Calibration Check';save.disabled=T.calSaving
  save.onclick=tempsSaveCalibration
  acts.appendChild(save);form.appendChild(acts)
  wrap.appendChild(form)

  if(!T.calLoaded&&!T.calLoading)tempsLoadCalibration(T)
  const sh=el('div','mod-section-hdr');sh.textContent='Recent checks';wrap.appendChild(sh)
  if(T.calLoading){const e=el('div','mod-empty');e.textContent='Loading…';wrap.appendChild(e)}
  else if(!T.calItems.length){const e=el('div','mod-empty');e.textContent='No calibration checks logged yet';wrap.appendChild(e)}
  else T.calItems.forEach(r=>{
    const c=el('div','mod-card'+(r.overall_pass?'':' warn'))
    const when=new Date(r.logged_at)
    c.innerHTML=`<div class="mod-card-hdr"><div><div class="mod-card-title">${esc(r.probe_name)}</div><div class="mod-card-sub">${when.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})} ${when.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${esc(r.staff_name||'—')}</div></div><span class="mod-pill ${r.overall_pass?'green':'red'}">${r.overall_pass?'✓ Pass':'✕ Fail'}</span></div><div class="h-meta" style="margin-top:6px">Ice: ${r.ice_water_temp}°C ${r.ice_pass?'✓':'✕'} · Boiling: ${r.boiling_water_temp}°C ${r.boil_pass?'✓':'✕'}</div>${r.corrective_action?`<div class="h-meta" style="color:var(--warn);margin-top:4px">Action: ${esc(r.corrective_action)}</div>`:''}${r.notes?`<div class="h-meta" style="margin-top:4px">${esc(r.notes)}</div>`:''}`
    wrap.appendChild(c)
  })
  app.appendChild(wrap)
}

async function logSingleTemp(unit){
  const T=G.temps
  if(!db){alert('Not connected to the database yet.');return}
  const val=T.readings[unit.id]
  if(!val||val==='-')return
  if(!T.staffName.trim()){alert('Please enter your name.');return}
  const s=getTempStatus(unit,val)
  if((s==='warn'||s==='danger')&&!T.actions[unit.id]?.trim()){alert('Please add corrective action for '+unit.name);return}
  const row={unit_id:unit.id,unit_name:unit.name,area:unit.area,session:T.session,temperature:parseFloat(val),corrective_action:T.actions[unit.id]||null,staff_name:T.staffName.trim(),logged_at:new Date().toISOString(),log_date:todayStr()}
  const{error}=await db.from(TEMP_TABLE).insert(row)
  if(error){alert('Error: '+error.message);return}
  T.submitted[unit.id]=true
  if(!T.unitHist[unit.id])T.unitHist[unit.id]=[]
  T.unitHist[unit.id].unshift(row);render()
}

async function logAllTemps(units){
  const T=G.temps
  if(!db){alert('Not connected to the database yet.');return}
  if(!T.staffName.trim()){alert('Please enter your name.');return}
  const toLog=units.filter(u=>T.readings[u.id]&&T.readings[u.id]!=='-'&&!isNaN(parseFloat(T.readings[u.id]))&&!T.submitted[u.id])
  for(const u of toLog){
    const s=getTempStatus(u,T.readings[u.id])
    if((s==='warn'||s==='danger')&&!T.actions[u.id]?.trim()){alert('Add corrective action for '+u.name);return}
  }
  const rows=toLog.map(u=>({unit_id:u.id,unit_name:u.name,area:u.area,session:T.session,temperature:parseFloat(T.readings[u.id]),corrective_action:T.actions[u.id]||null,staff_name:T.staffName.trim(),logged_at:new Date().toISOString(),log_date:todayStr()}))
  if(!rows.length)return
  const{error}=await db.from(TEMP_TABLE).insert(rows)
  if(error){alert('Error: '+error.message);return}
  rows.forEach(r=>{T.submitted[r.unit_id]=true;if(!T.unitHist[r.unit_id])T.unitHist[r.unit_id]=[];T.unitHist[r.unit_id].unshift(r)})
  render()
}

async function init(){
  render()
  if(!db)return
  const{data}=await db.from(TEMP_TABLE).select('*').eq('log_date',todayStr()).order('logged_at',{ascending:false})
  ;(data||[]).forEach(row=>{if(!G.temps.unitHist[row.unit_id])G.temps.unitHist[row.unit_id]=[];G.temps.unitHist[row.unit_id].push(row)})
  render()
  db.channel('cs-temps').on('postgres_changes',{event:'INSERT',schema:'public',table:TEMP_TABLE},p=>{const r=p.new;if(!G.temps.unitHist[r.unit_id])G.temps.unitHist[r.unit_id]=[];G.temps.unitHist[r.unit_id].unshift(r);const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()}).subscribe()
}
init()
</script>
